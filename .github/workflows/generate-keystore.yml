name: Generate Android Signing Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: '自定义签名密码（至少 6 位字母或数字，请牢记）'
        required: true
        type: string
      key_alias:
        description: '密钥别名（保持默认 feiartical 即可）'
        required: false
        default: 'feiartical'
        type: string

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Validate password length
        env:
          KS_PASS: ${{ inputs.keystore_password }}
        run: |
          if [ "${#KS_PASS}" -lt 6 ]; then
            echo "密码长度至少需要 6 位，请重新运行并输入更长的密码。"
            exit 1
          fi

      - name: Generate release keystore in cloud
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KS_ALIAS: ${{ inputs.key_alias }}
        run: |
          mkdir -p keystore-output
          ALIAS="${KS_ALIAS:-feiartical}"

          keytool -genkey -v \
            -keystore keystore-output/release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=FeiArtical, OU=Mobile, O=FeiArtical, L=Beijing, S=Beijing, C=CN" >/dev/null 2>&1

          base64 -w 0 keystore-output/release.keystore > keystore-output/ANDROID_KEYSTORE_BASE64.txt

          {
            echo "配置说明（只需在 GitHub 仓库 Settings -> Secrets and variables -> Actions -> Repository secrets 中添加 2 项）："
            echo ""
            echo "1. Name: ANDROID_KEYSTORE_BASE64"
            echo "   Secret: 完整复制 ANDROID_KEYSTORE_BASE64.txt 中的全部内容"
            echo ""
            echo "2. Name: KEYSTORE_PASSWORD"
            echo "   Secret: 你刚才在网页上填写的签名密码"
            echo ""
            echo "（KEY_ALIAS 默认使用 ${ALIAS}，KEY_PASSWORD 默认与 KEYSTORE_PASSWORD 相同，无需重复填写。）"
            echo "请妥善备份压缩包内的 release.keystore 文件，配置完成后可在本次 Actions 页面底部手动删除该下载包。"
          } > keystore-output/README.txt

      - name: Upload keystore package (auto-expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-keystore
          path: keystore-output/
          retention-days: 1

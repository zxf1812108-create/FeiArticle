name: Build Android Release APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '可选：本次发布说明'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package.json', 'scripts/patch-android-gradle.mjs') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compute version (1.x this year, 2.1 next year)
        id: version
        run: |
          git fetch --tags --force
          BASE_YEAR=2026
          CURRENT_YEAR=$(TZ='Asia/Shanghai' date +%Y)
          MAJOR=$((CURRENT_YEAR - BASE_YEAR + 1))
          if [ "$MAJOR" -lt 1 ]; then
            MAJOR=1
          fi

          LAST_MINOR=$(git tag -l "v${MAJOR}.*" | sed -E "s/^v${MAJOR}\.([0-9]+)$/\1/" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)

          if [ -z "$LAST_MINOR" ]; then
            MINOR=1
          else
            MINOR=$((LAST_MINOR + 1))
          fi

          VERSION_NAME="${MAJOR}.${MINOR}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR))
          TAG_NAME="v${VERSION_NAME}"

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed release version: ${VERSION_NAME} (versionCode=${VERSION_CODE}, tag=${TAG_NAME})"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Generate and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android permissions, version, and signing
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"
          fi

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/release.keystore
            KEY_ALIAS="${KEY_ALIAS:-feiartical}"
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            KEYSTORE_PASSWORD="feiartical-auto-keystore"
            KEY_ALIAS="feiartical"
            KEY_PASSWORD="feiartical-auto-keystore"
            keytool -genkey -v \
              -keystore android/app/release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=FeiArtical, OU=Mobile, O=FeiArtical, L=Beijing, S=Beijing, C=CN"
            echo "SIGNING_MODE=ephemeral" >> "$GITHUB_ENV"
          fi

          {
            echo "FEI_STORE_FILE=release.keystore"
            echo "FEI_STORE_PASSWORD<<FEI_ENV_EOF"
            printf '%s\n' "$KEYSTORE_PASSWORD"
            echo "FEI_ENV_EOF"
            echo "FEI_KEY_ALIAS<<FEI_ENV_EOF"
            printf '%s\n' "$KEY_ALIAS"
            echo "FEI_ENV_EOF"
            echo "FEI_KEY_PASSWORD<<FEI_ENV_EOF"
            printf '%s\n' "$KEY_PASSWORD"
            echo "FEI_ENV_EOF"
          } >> "$GITHUB_ENV"

          node scripts/patch-android-gradle.mjs

      - name: Build signed Release APK
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle assembleRelease attempt ${attempt}/3..."
            if ./gradlew assembleRelease --no-daemon --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed, retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Prepare APK artifact and release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p release-output
          APK_FILE="release-output/FeiArtical-v${VERSION_NAME}-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          ls -lh release-output/

          {
            echo "### FeiArtical ${TAG_NAME} (Android Release APK)"
            echo ""
            echo "- **版本号**：\`${VERSION_NAME}\` (\`versionCode: ${VERSION_CODE}\`)"
            echo "- **下载地址**：点击下方 \`FeiArtical-v${VERSION_NAME}-release.apk\` 直接下载安装。"
            if [ -n "$RELEASE_NOTES" ]; then
              echo "- **更新说明**：${RELEASE_NOTES}"
            fi
            if [ "${SIGNING_MODE}" = "ephemeral" ]; then
              echo ""
              echo "> 提示：本次使用自动生成的临时密钥签名；若希望后续版本直接覆盖升级，可先运行一次「Generate Android Signing Keystore」工作流生成密钥，再在 Settings → Secrets → Repository secrets 中添加 \`ANDROID_KEYSTORE_BASE64\` 和 \`KEYSTORE_PASSWORD\`。"
            fi
          } > release-output/release-notes.md

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiArtical-v${{ steps.version.outputs.version_name }}-release-apk
          path: release-output/FeiArtical-v${{ steps.version.outputs.version_name }}-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: FeiArtical ${{ steps.version.outputs.tag_name }}
          body_path: release-output/release-notes.md
          files: release-output/FeiArtical-v${{ steps.version.outputs.version_name }}-release.apk
